<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="file.css">
</head>

<body>
    <div class="container">
        <div class="login-page">
            <h3>Sign up</h3>
            <form action="" class="form">
                <div class="input-group">
                    <label for="name">Full name</label>
                    <input type="text" name="name" id="name" placeholder="">
                </div>
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password">
                </div>
                <button type="submit"> create account</button>
            </form>
            <div class="login-social-media">
                <p>Do you have an account? <a href="login"> login</a></p>
                <button> <img  src="./image/images.jpg" alt="google"><span>sign up with Google</span></button>
                <button> <img  src="./image/facebook .jpg" alt="facebook"><span>sign up with facebook</span></button>
            </div>
        </div>

        <div class="image">
                <img style="width: 100%;" src="./image/login-image.png" alt="sajid">
                <span>✖</span>
            <div class="sunandleaenify">
                <img style="width: 25px;" src="./image/sunrise.png" alt="sun rise">
                <p>Learnify</p>
            </div>
        </div>
    </div>
</body>

</html>
